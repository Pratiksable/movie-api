services:
  postgres:
    image: postgres:17-alpine
    container_name: movie-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: movie_db
    ports:
      - "5432:5432"
    volumes:
      - movie_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movie_user -d movie_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  movie_postgres_data: